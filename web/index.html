<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f9f8f5" />
    <meta
      name="description"
      content="A team kudos board to recognise, appreciate and celebrate your colleagues."
    />
    <title>Kudos — celebrate your team</title>
    <script>
      // Apply the saved theme and language before first paint so nothing flashes the wrong palette.
      ;(function () {
        try {
          var stored = localStorage.getItem('kudos.theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')

          var lang = localStorage.getItem('kudos.lang')
          if (lang) document.documentElement.lang = lang
        } catch (error) {
          /* no stored preference available */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
